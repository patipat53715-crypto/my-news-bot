name: Daily News Notifier

on:
  schedule:
    # 00:00 UTC = 07:00 เวลาไทย (Asia/Bangkok, UTC+7)
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # เผื่ออยากกดรันเองทดสอบผ่านหน้า GitHub ได้ทันที

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run news notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python news_notifier.py
